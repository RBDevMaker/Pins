<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DAR Pin Layout Builder</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        background: linear-gradient(160deg, #1a2f5a 0%, #243b6e 50%, #1e3462 100%);
        color: #1a2f5a;
        min-height: 100vh;
        overflow-x: hidden;
      }
      /* Subtle animated background shimmer */
      body::before {
        content: '';
        position: fixed;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(ellipse at center, rgba(212,175,55,0.03) 0%, transparent 60%);
        animation: shimmer 20s ease-in-out infinite alternate;
        pointer-events: none;
        z-index: 0;
      }
      @keyframes shimmer {
        0% { transform: translate(0, 0) rotate(0deg); }
        100% { transform: translate(5%, 3%) rotate(2deg); }
      }
      #root { position: relative; z-index: 1; }
      /* Smooth transitions for interactive elements */
      button { transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.12s ease; }
      button:hover { transform: translateY(-1px); }
      button:active { transform: translateY(0px); }
      /* Scrollbar */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 3px; }
      ::-webkit-scrollbar-thumb { background: rgba(212,175,55,0.4); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(212,175,55,0.6); }
      ::selection { background: rgba(212,175,55,0.3); }
      /* Fade in animation */
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(16px); }
        to { opacity: 1; transform: translateY(0); }
      }
      #root > div { animation: fadeInUp 0.5s ease-out; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
